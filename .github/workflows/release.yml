  # End-to-end check that the published install scripts actually work against
  # the real release. Runs after the release exists.
  verify-install:
    needs: [build, release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install via install.sh
        if: matrix.os != 'windows-latest'
        env:
          SENDLAYER_VERSION: ${{ github.ref_name }}
          SENDLAYER_INSTALL_DIR: ${{ runner.temp }}/sendlayer-bin
        run: |
          bash scripts/install.sh
          "$SENDLAYER_INSTALL_DIR/sendlayer" --version
          "$SENDLAYER_INSTALL_DIR/sendlayer" webhooks list --help > /dev/null

      - name: Install via install.ps1
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          SENDLAYER_VERSION: ${{ github.ref_name }}
          SENDLAYER_INSTALL_DIR: ${{ runner.temp }}\sendlayer-bin
        run: |
          ./scripts/install.ps1
          & "$env:SENDLAYER_INSTALL_DIR\sendlayer.exe" --version
          & "$env:SENDLAYER_INSTALL_DIR\sendlayer.exe" webhooks list --help | Out-Null
