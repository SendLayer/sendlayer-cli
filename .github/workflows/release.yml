name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Guard: the tag must match the version in package.json, otherwise the
      # release archives, formula and npm package would disagree.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Compile native binaries
        run: bash scripts/build-binaries.sh "${{ steps.meta.outputs.version }}"

      - name: Generate Homebrew formula
        run: bash scripts/gen-homebrew-formula.sh "${{ steps.meta.outputs.version }}"

      # Smoke-test the binary that was just built for this runner's platform.
      - name: Smoke test linux binary
        run: |
          tar -xzf "dist-bin/sendlayer_${{ steps.meta.outputs.version }}_linux_x64.tar.gz" -C /tmp
          /tmp/sendlayer --version
          /tmp/sendlayer --help > /dev/null
          /tmp/sendlayer webhooks list --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist-bin
          path: dist-bin/

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@097829e880806b0863828e844a429538e2146d36 # v4.1.1
        with:
          name: dist-bin
          path: dist-bin
      - uses: softprops/action-gh-release@320377605023b2a1095615005459b30485295232 # v2.1.0
        with:
          files: |
            dist-bin/sendlayer_*.tar.gz
            dist-bin/sendlayer_*.zip
            dist-bin/SHA256SUMS
          generate_release_notes: true

  publish-npm:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          token: ${{ secrets.NPM_TOKEN }}
          provenance: true

  # ---------------------------------------------------------------------------
